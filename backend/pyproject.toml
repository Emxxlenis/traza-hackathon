[project]
name = "traza-backend"
version = "0.1.0"
description = "TRAZA — agente de investigación sobre datos públicos colombianos vía Croma"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic[email]>=2.8",
    "pydantic-settings>=2.4",
    "openai>=1.40",
    # Cuentas: SQLAlchemy async con SQLite en dev y Postgres en producción.
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "argon2-cffi>=23.1",
    "python-dotenv>=1.0",
]

[tool.setuptools]
packages = ["app", "agent", "evidence", "croma_client", "auth"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
