# Respaldo: despliegue en Render free tier (solo si Koyeb pide tarjeta en todas
# las regiones). El free tier suspende tras ~15 min de inactividad: configurar un
# ping externo cada 10 min a /health (cron-job.org) durante la ventana de evaluación.
services:
  - type: web
    name: traza
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: CROMA_API_KEY
        sync: false
      - key: CROMA_BASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_MODEL
        value: gpt-5.6-terra
      - key: RATE_LIMIT_PER_IP_HOUR
        value: "25"
      - key: RATE_LIMIT_GLOBAL_HOUR
        value: "200"
